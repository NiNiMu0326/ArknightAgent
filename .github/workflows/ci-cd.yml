name: CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch: # 允许在 GitHub 页面手动触发

# 防止多次 push 导致部署互相覆盖
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r backend/requirements.txt

      - name: 运行 pytest
        run: python -m pytest test/ -q

  deploy:
    name: 部署到服务器
    needs: test # 测试通过才部署
    runs-on: ubuntu-latest
    steps:
      # 部署统一交给 systemd（arknights-rag.service，Restart=always）：
      # 不用 pkill + nohup——会与 systemd 的自动重启冲突，产生两个 uvicorn 进程抢端口。
      # git 用 fetch + reset --hard 而不是 pull：服务器上 cron 每日同步会改动
      # Scripts/*_log.txt、npm install 会改动 package-lock.json，pull 必然冲突失败。
      - name: SSH 拉取代码并构建前端
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /srv/projects/arknights-rag
            git fetch origin master
            git reset --hard origin/master
            export PATH="$HOME/.local/bin:$PATH"
            if ! command -v uv >/dev/null 2>&1; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi
            if [ ! -x .venv/bin/python ]; then
              uv python install 3.11
              uv venv --python 3.11 .venv
            fi
            uv pip install --python .venv/bin/python -r backend/requirements.txt
            cd frontend
            npm install
            npm run build
            # 同步构建产物到 nginx 静态根目录（前端由 nginx 从 /var/www/arknights 直接伺服，
            # 缺了这一步新前端永远不会生效，/agent 等 API 路径才走 uvicorn）
            mkdir -p /var/www/arknights
            rsync -a --delete /srv/projects/arknights-rag/frontend/dist/ /var/www/arknights/

      - name: SSH 重启服务并健康检查
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            systemctl restart arknights-rag
            for i in $(seq 1 6); do
              curl -fsS http://localhost:8889/health && break
              sleep 5
            done

      - name: 外部健康检查
        run: curl -fsS --max-time 15 https://ninimu.top:14606/health
